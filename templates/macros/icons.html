{% macro icon(name, cls='') -%}
<svg class="ui-icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="4" rx="2"/><rect x="14" y="11" width="7" height="10" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/>
{% elif name == 'sites' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.3 3 14.7 0 18M12 3c-3 3.3-3 14.7 0 18"/>
{% elif name == 'database' %}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{% elif name == 'backup' %}<path d="M4 8V4h4M4.8 4.8A9 9 0 1 1 3.3 14"/><path d="M12 7v5l3 2"/>
{% elif name == 'shield' %}<path d="M12 3l7 3v5c0 4.7-2.9 8-7 10-4.1-2-7-5.3-7-10V6l7-3z"/><path d="M9 12l2 2 4-5"/>
{% elif name == 'activity' %}<path d="M3 12h4l2.2-5 4.2 10 2.3-5H21"/>
{% elif name == 'docker' %}<rect x="4" y="9" width="3" height="3" rx=".5"/><rect x="8" y="9" width="3" height="3" rx=".5"/><rect x="12" y="9" width="3" height="3" rx=".5"/><rect x="8" y="5" width="3" height="3" rx=".5"/><rect x="12" y="5" width="3" height="3" rx=".5"/><path d="M3 13h14c1.8 0 3-.6 4-2 0 5.4-3.6 9-9 9H8c-3 0-5-2-5-7z"/>
{% elif name == 'users' %}<circle cx="9" cy="8" r="3"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6M16 5.5c2 .2 3 1.3 3 3s-1 2.8-3 3M17 14c2.5.6 3.8 2.5 4 6"/>
{% elif name == 'audit' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>
{% elif name == 'cpu' %}<rect x="7" y="7" width="10" height="10" rx="2"/><rect x="10" y="10" width="4" height="4" rx="1"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/>
{% elif name == 'ram' %}<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 10v4M11 10v4M15 10v4M5 17v3M9 17v3M15 17v3M19 17v3"/>
{% elif name == 'disk' %}<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/><path d="M16.5 7.5h.01"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/>
{% elif name == 'spark' %}<path d="M13 2L5 14h6l-1 8 9-13h-6z"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
{% elif name == 'bell' %}<path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3V9M10 20h4"/>
{% elif name == 'server' %}<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>
{% elif name == 'chevron' %}<path d="M9 6l6 6-6 6"/>
{% else %}<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>{% endif %}
</svg>
{%- endmacro %}
