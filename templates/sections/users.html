<section id="users"><div class="section-title"><div><span class="kicker">ACCESS CONTROL</span><h2>المستخدمون والصلاحيات</h2><p>طبقة أولى من RBAC مستلهمة من فصل Admin/Reseller/User: Admin وOperator وViewer.</p></div><span class="pill">RBAC</span></div><div class="two"><form class="panel" method="post" action="/users" autocomplete="off"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h3>مستخدم لوحة جديد</h3><label>اسم المستخدم</label><input name="username" minlength="3" maxlength="32" required><label>الدور</label><select name="role"><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Admin</option></select><label>كلمة المرور</label><input type="password" name="password" minlength="14" required autocomplete="new-password"><button>إنشاء المستخدم</button></form><div class="panel"><h3>الحسابات</h3><div class="table"><div class="row"><div><b>admin</b><small>Bootstrap administrator</small></div><span class="tag">ADMIN</span></div>{% for u in users %}<div class="row"><div><b>{{u.username}}</b><small>{{u.created_at|when}}</small></div><span class="tag {{'off' if not u.enabled else ''}}">{{u.role|upper}}</span></div>{% endfor %}</div></div></div></section>
