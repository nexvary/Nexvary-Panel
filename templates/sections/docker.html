<section id="docker"><div class="section-title"><div><span class="kicker">CONTAINERS</span><h2>Docker Center</h2><p>رؤية الحاويات الموجودة والتحكم في start/stop/restart، بدون السماح بتشغيل صور عشوائية من الواجهة في هذه المرحلة.</p></div><button id="dockerRefresh" class="action-button ghost" type="button">تحديث</button></div><div class="panel"><div id="dockerList" class="table"><div class="empty">اضغط تحديث لقراءة الحاويات.</div></div>{% if role != 'viewer' %}<form method="post" action="/docker/control" class="inline-form"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="container" placeholder="container_name" required pattern="[A-Za-z0-9_.-]{1,128}"><select name="desired"><option value="restart">Restart</option><option value="start">Start</option><option value="stop">Stop</option></select><button>تنفيذ</button></form>{% endif %}</div></section>
