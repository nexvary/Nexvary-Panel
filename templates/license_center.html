<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>License Center</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="auth-card" style="max-width:900px;margin:5vh auto"><h1>License Center</h1><p>الحالة: <b>{{license_state.status}}</b></p><p>License ID: {{license_state.claims.get('license_id','—')}}</p><p>Server Fingerprint</p><code style="word-break:break-all">{{fingerprint}}</code><h2>تثبيت ترخيص موقّع</h2><form method="post" action="/license/install"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><textarea name="license_json" rows="12" required style="width:100%" placeholder="Signed license JSON"></textarea><button type="submit">تحقق وثبّت</button></form>{% if license_state.feature('white_label') %}<p><a href="/branding">فتح Branding Center</a></p>{% endif %}<p><a href="/">العودة إلى اللوحة</a></p></main></body></html>
